# Weekly dependency updates; minor and patch bumps are grouped into one PR per ecosystem.
# Majors arrive as individual PRs so each breaking change is reviewed on its own.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /backend
      - /backend/tools
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Dockerfiles arrive with H3-03; until then Dependabot reports "no Dockerfile" for these directories.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
