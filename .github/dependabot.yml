# Weekly dependency updates; minor and patch bumps are grouped into one PR per ecosystem.
# Majors arrive as individual PRs so each breaking change is reviewed on its own.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /backend
      - /backend/tools
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must track the runtime major pinned in frontend/.nvmrc (Node 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10 is blocked until eslint-plugin-react / jsx-a11y support it. See #50.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Dockerfiles arrive with H3-03; until then Dependabot reports "no Dockerfile" for these directories.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
