# Stack CI: build both images and smoke-test the composed stack the way a
# reviewer runs it locally (`make up && make smoke`).
#
# Same shape as backend.yml/frontend.yml: pull requests always start the
# workflow so `ci-ok (stack)` reports on every PR, and the `changes` job
# decides whether the expensive build runs. A workflow-level `paths:` filter
# on pull_request would leave the check pending forever on unrelated PRs,
# which matters the day this check becomes required. Pushes to main use a
# plain paths filter.
name: stack

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "scripts/**"
      - ".github/workflows/stack.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ $EVENT != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -qE '^(backend/|frontend/|scripts/|compose\.yaml$|\.github/workflows/stack\.yml$)' <<<"$files"; then
            run=true
          else
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "stack changed: $run"

  smoke:
    name: smoke
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Bake reads compose.yaml's build sections, so CI builds exactly the
      # images `docker compose up --build` would, with a layer cache per
      # image. `load: true` puts them in the daemon for compose to run.
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: compose.yaml
          targets: backend,frontend
          load: true
          set: |
            backend.cache-from=type=gha,scope=stack-backend
            backend.cache-to=type=gha,mode=max,scope=stack-backend
            frontend.cache-from=type=gha,scope=stack-frontend
            frontend.cache-to=type=gha,mode=max,scope=stack-frontend

      - name: Image sizes
        run: |
          # One repository argument per invocation (docker 29), so filter instead.
          sizes=$(docker image ls --filter 'reference=go-react-calculator-*' \
            --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}')
          echo "$sizes"
          {
            echo "### Image sizes"
            echo
            echo '```'
            echo "$sizes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 120 --no-build

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Container hardening
        run: |
          for c in $(docker compose ps -q); do
            docker inspect "$c" --format \
              '{{.Name}} user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}} capDrop={{.HostConfig.CapDrop}} securityOpt={{.HostConfig.SecurityOpt}} health={{json .Config.Healthcheck.Test}}'
          done

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans --volumes

  e2e:
    # Playwright against the same composed stack `smoke` just proved works, with the backend's
    # rate limiter raised (compose.e2e.yaml) so a suite clicking through the UI doesn't trip the
    # 429s that limiter is there to catch (H3-04, #22).
    #
    # Deliberately NOT a dependency of `ci-ok (stack)`: it must still run and report on every PR
    # (so a failure is visible), but a flaky browser test should not block unrelated docs/release
    # PRs from going green. `smoke` staying required is what keeps the stack itself gated.
    name: e2e
    needs: smoke
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same bake as `smoke`, same cache scopes, so this job reuses the layers `smoke` already
      # built and pushed to the GHA cache rather than rebuilding from scratch.
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: compose.yaml
          targets: backend,frontend
          load: true
          set: |
            backend.cache-from=type=gha,scope=stack-backend
            frontend.cache-from=type=gha,scope=stack-frontend

      - name: Start the stack (e2e rate limits)
        run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --wait --wait-timeout 120 --no-build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Run e2e suite
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Compose logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down --remove-orphans --volumes

  ci-ok:
    # Single aggregate status for this workflow. Skipped jobs pass; failed or
    # cancelled jobs fail. `e2e` is deliberately excluded — see its comment.
    name: ci-ok (stack)
    needs: [changes, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            exit 1
          fi
