# Response headers every document and asset served from this origin carries.
#
# It is a separate file because nginx's add_header does not merge across
# levels: the moment a location adds one header of its own, it stops
# inheriting the server block's. Including this file in each location that
# sets Cache-Control keeps the set complete without duplicating it by hand.
#
# `always` makes them apply to error responses (404 from try_files) too.
#
# Deliberately not included in `location /api/`: the Go service sets its own
# security headers (backend/internal/middleware), and appending these would
# send each one twice.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# Minimal: the app uses no device APIs at all, so every capability we can name
# is switched off for this document and anything it embeds.
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# The Vite build emits an external module script and an external stylesheet —
# no inline <script> — so script-src 'self' holds without a nonce or a hash
# (verified against dist/index.html; see ADR-0009). 'unsafe-inline' is kept
# for style-src only: Radix primitives set style="" attributes at runtime, and
# CSP level 3 counts those as inline styles. connect-src 'self' is enough
# because the API is same-origin through the /api/ proxy below.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
