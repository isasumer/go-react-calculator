# The whole product on one machine: `docker compose up --build --wait`, then
# open http://localhost:8080 (ADR-0009).
#
# Only the frontend is published. The browser talks to nginx, nginx proxies
# /api/ to the Go service over the private network, and the API is not
# reachable from the host at all — which is how it is deployed, and what
# scripts/smoke.sh asserts. To poke the API directly during development:
#
#   cp compose.override.example.yaml compose.override.yaml
#
# VERSION/COMMIT/BUILD_DATE are optional; they stamp the images and show up in
# `server -version`, GET /version and the build_info metric.

name: go-react-calculator

services:
  backend:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: go-react-calculator-backend:dev
    environment:
      # Shipping format: one JSON object per line for a log collector.
      LOG_FORMAT: json
      LOG_LEVEL: info
      PORT: "8081"
      # No browser ever reaches this service cross-origin: nginx serves the
      # app and the API from the same origin, so the allowlist stays empty.
      CORS_ALLOWED_ORIGINS: ""
      # nginx always sets X-Forwarded-For, so the rate limiter may key on it.
      TRUST_PROXY_HEADERS: "true"
    # The image has no shell and no curl; the binary probes itself.
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Nothing in this container writes to disk, so take the filesystem away.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    networks: [calc]
    # Deliberately no `ports:` — see compose.override.example.yaml.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_VERSION: ${VERSION:-dev}
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: go-react-calculator-frontend:dev
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Substituted into /etc/nginx/conf.d/default.conf at start.
      BACKEND_UPSTREAM: backend:8081
    ports:
      # The app's front door. FRONTEND_PORT only moves the *host* side, for
      # machines where 8080 is already taken; everything inside the stack,
      # and scripts/smoke.sh by default, still speaks 8080.
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped
    networks: [calc]

networks:
  calc:
    driver: bridge
